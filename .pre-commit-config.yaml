repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: ^requirements\.lock$
  - repo: local
    hooks:
      - id: forbid-env-files
        name: forbid committing .env / config.yaml
        entry: "refusing to commit a local secrets/config file"
        language: fail
        files: (^|/)(\.env(\..*)?|config\.yaml)$
        exclude: (^|/)\.env\.example$
